<h2>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="name">Name:</label>
    <input id="name" type="text" formControlName="name">
    <div *ngIf="productForm.controls['name'].invalid && productForm.controls['name'].touched">
      Name is required.
    </div>
  </div>

  <div>
    <label for="description">Description:</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>

  <div>
    <label for="image">Image URL:</label>
    <input id="image" type="text" formControlName="image">
  </div>

  <div>
    <label for="price">Price:</label>
    <input id="price" type="number" formControlName="price">
    <div *ngIf="productForm.controls['price'].invalid && productForm.controls['price'].touched">
      Price is required and must be a positive number.
    </div>
  </div>

  <button type="submit" [disabled]="!productForm.valid">{{ isEditMode ? 'Update Product' : 'Add Product' }}</button>
  <button type="button" routerLink="/products">Cancel</button>
</form>
